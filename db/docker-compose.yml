services:
  postgres:
    image: postgres:17
    container_name: eve-care-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eve_care
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eve_care"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
