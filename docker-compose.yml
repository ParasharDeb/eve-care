services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eve_care
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eve_care"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # secrets come from backend/.env (copy backend/.env.example). no defaults on purpose:
    # a missing secret stops the api at startup instead of running with a guessable one
    env_file:
      - ./backend/.env
    environment:
      # overrides the localhost url in backend/.env: inside compose the db is the "postgres" service
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/eve_care?schema=public
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8080:8080"

volumes:
  pgdata:
